<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hyrcanian Airmail: a 1930s mail-plane flight game along the Caspian coast">
<title>Hyrcanian Airmail</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1522; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Hyrcanian Airmail: fly a mail plane with the arrow keys, throttle with W and S, drop mail sacks with Space"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
